<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yolked — Egg Aim Trainer</title>
<style>
  :root {
    --ground: #101217;
    --panel: #181c24;
    --panel-2: #1f2430;
    --line: #2a3040;
    --ink: #f2ede3;
    --muted: #8b94a7;
    --yolk: #ffc53d;
    --yolk-deep: #f5a300;
    --good: #6fd08c;
    --bad: #e8705f;
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--yolk); outline-offset: 2px; }

  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: flex; }

  /* ---------- Menu ---------- */
  #menu { flex-direction: column; align-items: center; overflow-y: auto; padding: 40px 20px 60px; }
  .brand { text-align: center; margin-bottom: 8px; }
  .brand h1 {
    font-size: clamp(44px, 8vw, 72px);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .brand h1 .accent { color: var(--yolk); }
  .brand p { color: var(--muted); margin-top: 10px; font-size: 15px; }
  .brand p b { color: var(--ink); font-weight: 600; }

  .modes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    width: min(1040px, 100%);
    margin-top: 28px;
  }
  .mode-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 14px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 120ms ease, transform 120ms ease;
  }
  .mode-card:hover { border-color: var(--yolk); transform: translateY(-2px); }
  .mode-card .tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--yolk);
  }
  .mode-card h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .mode-card .desc { color: var(--muted); font-size: 13.5px; line-height: 1.45; min-height: 40px; }
  .mode-stats {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
    margin-top: auto;
  }
  .pb-label { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .pb-value { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; }
  .pb-value .unit { font-size: 12px; color: var(--muted); font-weight: 400; }
  .spark { width: 110px; height: 34px; flex: none; }

  .menu-foot { margin-top: 26px; display: flex; gap: 18px; align-items: center; color: var(--muted); font-size: 13px; }
  .menu-foot button { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .menu-foot button:hover { color: var(--ink); }

  /* ---------- Play ---------- */
  #play { cursor: crosshair; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 16px 22px;
    pointer-events: none;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .hud .cell { display: flex; flex-direction: column; gap: 2px; }
  .hud .cell.right { text-align: right; }
  .hud .label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-family: system-ui, sans-serif; }
  .hud .value { font-size: 26px; font-weight: 700; }
  .hud .value.warn { color: var(--bad); }
  #quit-btn {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; letter-spacing: 0.08em;
  }
  #quit-btn:hover { color: var(--ink); }

  #countdown {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    font-size: 120px; font-weight: 900; color: var(--yolk);
    pointer-events: none;
  }
  #countdown.active { display: flex; }

  /* ---------- Reflex ---------- */
  #reflex { flex-direction: column; align-items: center; justify-content: center; gap: 18px; cursor: pointer; }
  #reflex.hold { background: var(--panel); }
  #reflex.go { background: var(--yolk); color: #1a1405; }
  #reflex-word { font-size: clamp(48px, 10vw, 96px); font-weight: 900; letter-spacing: -0.02em; }
  #reflex-sub { font-size: 15px; opacity: 0.75; }
  #reflex-times { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; opacity: 0.75; min-height: 20px; }

  /* ---------- Results ---------- */
  #results { flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 20px; }
  #results .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--yolk); }
  #results h2 { font-size: 30px; font-weight: 800; }
  #result-score {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: clamp(64px, 14vw, 120px); font-weight: 700; line-height: 1;
    margin: 8px 0 2px;
  }
  #result-score .unit { font-size: 0.3em; color: var(--muted); font-weight: 400; }
  #pb-badge {
    display: none;
    background: var(--yolk); color: #1a1405;
    font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 5px 12px; border-radius: 99px;
  }
  #pb-badge.show { display: inline-block; }
  #result-detail { color: var(--muted); font-size: 14.5px; font-family: var(--mono); font-variant-numeric: tabular-nums; margin-top: 6px; }
  .result-actions { display: flex; gap: 12px; margin-top: 26px; }
  .btn {
    padding: 12px 26px;
    border-radius: var(--radius);
    font-weight: 700;
    font-size: 15px;
    border: 1px solid var(--line);
    background: var(--panel);
    transition: border-color 120ms ease;
  }
  .btn:hover { border-color: var(--yolk); }
  .btn.primary { background: var(--yolk); color: #1a1405; border-color: var(--yolk); }
  .btn.primary:hover { background: var(--yolk-deep); border-color: var(--yolk-deep); }

  .spark-tip {
    position: fixed;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    pointer-events: none;
    display: none;
    z-index: 10;
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .mode-card, .btn { transition: none; }
  }
</style>
</head>
<body>

<div id="menu" class="screen active">
  <div class="brand">
    <h1>YOL<span class="accent">KED</span></h1>
    <p>Egg-powered aim training. Pick a drill, crack some shells, beat your <b>PB</b>.</p>
  </div>
  <div class="modes" id="modes"></div>
  <div class="menu-foot">
    <span id="run-count"></span>
    <button id="sound-toggle" type="button">sound: on</button>
    <button id="wipe-btn" type="button">reset stats</button>
  </div>
</div>

<div id="play" class="screen">
  <canvas id="canvas"></canvas>
  <div class="hud">
    <div class="cell">
      <span class="label" id="hud-score-label">Hits</span>
      <span class="value" id="hud-score">0</span>
    </div>
    <div class="cell right">
      <span class="label">Time</span>
      <span class="value" id="hud-time">30.0</span>
    </div>
  </div>
  <div id="countdown">3</div>
  <button id="quit-btn" type="button">esc · quit to menu</button>
</div>

<div id="reflex" class="screen hold">
  <div id="reflex-word">WAIT…</div>
  <div id="reflex-sub">Click the instant the screen turns yolk.</div>
  <div id="reflex-times"></div>
</div>

<div id="results" class="screen">
  <span class="tag" id="result-mode">Splatter</span>
  <div id="pb-badge">New personal best</div>
  <div id="result-score">0</div>
  <div id="result-detail"></div>
  <div class="result-actions">
    <button class="btn primary" id="retry-btn" type="button">Run it back</button>
    <button class="btn" id="menu-btn" type="button">Menu</button>
  </div>
</div>

<div class="spark-tip" id="spark-tip"></div>

<script>
"use strict";

/* ============================== Config ============================== */

const MODES = {
  splatter: {
    name: "Splatter",
    tag: "Speed",
    desc: "Three eggs on screen at once for 30 seconds. Crack them as fast as you can.",
    unit: "hits",
    higherIsBetter: true,
    duration: 30,
    fmt: v => String(Math.round(v)),
  },
  flick: {
    name: "Flick",
    tag: "Precision",
    desc: "One egg at a time, teleporting across the screen. Snap to it — 30 seconds.",
    unit: "hits",
    higherIsBetter: true,
    duration: 30,
    fmt: v => String(Math.round(v)),
  },
  track: {
    name: "Track",
    tag: "Control",
    desc: "A runaway egg wanders and speeds up. Keep your cursor glued to it for 30 seconds.",
    unit: "% on egg",
    higherIsBetter: true,
    duration: 30,
    fmt: v => v.toFixed(1),
  },
  reflex: {
    name: "Reflex",
    tag: "Reaction",
    desc: "Five rounds. Wait for the screen to flash yolk, then click instantly. Average reaction time.",
    unit: "ms avg",
    higherIsBetter: false,
    fmt: v => String(Math.round(v)),
  },
};

const STORE_KEY = "yolked.v1";
const MAX_HISTORY = 50;
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============================== Storage ============================= */

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* corrupted or unavailable — start fresh */ }
  return { runs: {}, sound: true };
}
const store = loadStore();

function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}

function recordRun(mode, score) {
  const runs = store.runs[mode] || (store.runs[mode] = []);
  runs.push({ t: Date.now(), score });
  if (runs.length > MAX_HISTORY) runs.splice(0, runs.length - MAX_HISTORY);
  saveStore();
}

function personalBest(mode) {
  const runs = store.runs[mode];
  if (!runs || !runs.length) return null;
  const scores = runs.map(r => r.score);
  return MODES[mode].higherIsBetter ? Math.max(...scores) : Math.min(...scores);
}

/* ============================== Audio =============================== */

let audioCtx = null;
function beep(freq, dur, type = "square", gainVal = 0.05) {
  if (!store.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  crack: () => { beep(520, 0.07); beep(760, 0.1, "triangle", 0.04); },
  miss: () => beep(140, 0.12, "sawtooth", 0.03),
  count: () => beep(440, 0.1, "sine", 0.05),
  go: () => beep(880, 0.18, "sine", 0.06),
  best: () => { beep(660, 0.12, "sine", 0.05); setTimeout(() => beep(990, 0.2, "sine", 0.05), 110); },
};

/* ============================== Screens ============================= */

const $ = id => document.getElementById(id);
const screens = { menu: $("menu"), play: $("play"), reflex: $("reflex"), results: $("results") };
function show(name) {
  for (const key in screens) screens[key].classList.toggle("active", key === name);
}

/* ============================== Menu ================================ */

const YOLK = "#ffc53d";

function sparklineSVG(runs, higherIsBetter) {
  const pts = runs.slice(-12).map(r => r.score);
  if (pts.length < 2) return "<svg class='spark' aria-hidden='true'></svg>";
  const w = 110, h = 34, pad = 4;
  let min = Math.min(...pts), max = Math.max(...pts);
  if (min === max) { min -= 1; max += 1; }
  const x = i => pad + (i / (pts.length - 1)) * (w - pad * 2);
  const y = v => h - pad - ((v - min) / (max - min)) * (h - pad * 2);
  const d = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const lastX = x(pts.length - 1).toFixed(1), lastY = y(pts[pts.length - 1]).toFixed(1);
  const best = higherIsBetter ? Math.max(...pts) : Math.min(...pts);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Recent scores, best ${best}">
    <path d="${d}" fill="none" stroke="${YOLK}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastX}" cy="${lastY}" r="3" fill="${YOLK}"/>
  </svg>`;
}

function renderMenu() {
  const wrap = $("modes");
  wrap.innerHTML = "";
  let total = 0;
  for (const id in MODES) {
    const m = MODES[id];
    const runs = store.runs[id] || [];
    total += runs.length;
    const pb = personalBest(id);
    const card = document.createElement("button");
    card.className = "mode-card";
    card.type = "button";
    card.innerHTML = `
      <span class="tag">${m.tag}</span>
      <h2>${m.name}</h2>
      <p class="desc">${m.desc}</p>
      <div class="mode-stats">
        <div>
          <div class="pb-label">Best</div>
          <div class="pb-value">${pb === null ? "—" : m.fmt(pb)} <span class="unit">${m.unit}</span></div>
        </div>
        ${sparklineSVG(runs, m.higherIsBetter)}
      </div>`;
    card.addEventListener("click", () => startMode(id));
    attachSparkHover(card, runs, m);
    wrap.appendChild(card);
  }
  $("run-count").textContent = total === 0 ? "No runs yet — everything is tracked locally."
    : `${total} run${total === 1 ? "" : "s"} logged on this device.`;
  $("sound-toggle").textContent = `sound: ${store.sound ? "on" : "off"}`;
}

const tip = $("spark-tip");
function attachSparkHover(card, runs, mode) {
  const svg = card.querySelector("svg.spark");
  if (!svg || runs.length < 2) return;
  const pts = runs.slice(-12);
  svg.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const frac = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
    const i = Math.round(frac * (pts.length - 1));
    const run = pts[i];
    tip.textContent = `${mode.fmt(run.score)} ${mode.unit} · ${new Date(run.t).toLocaleDateString()}`;
    tip.style.display = "block";
    tip.style.left = `${e.clientX + 12}px`;
    tip.style.top = `${e.clientY - 30}px`;
  });
  svg.addEventListener("mouseleave", () => { tip.style.display = "none"; });
}

$("sound-toggle").addEventListener("click", () => {
  store.sound = !store.sound;
  saveStore();
  $("sound-toggle").textContent = `sound: ${store.sound ? "on" : "off"}`;
  if (store.sound) sfx.count();
});

$("wipe-btn").addEventListener("click", () => {
  if (confirm("Wipe all Yolked stats on this device?")) {
    store.runs = {};
    saveStore();
    renderMenu();
  }
});

/* ============================== Canvas ============================== */

const canvas = $("canvas");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", () => { if (screens.play.classList.contains("active")) resize(); });

function drawEgg(x, y, r, wobble = 0) {
  ctx.save();
  ctx.translate(x, y);
  if (wobble) ctx.rotate(Math.sin(wobble) * 0.08);
  // shell
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.82, r, 0, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r * 1.2);
  grad.addColorStop(0, "#fdf8ee");
  grad.addColorStop(1, "#d9cdb4");
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.stroke();
  // highlight
  ctx.beginPath();
  ctx.ellipse(-r * 0.28, -r * 0.42, r * 0.16, r * 0.24, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.fill();
  ctx.restore();
}

/* splat particles */
let particles = [];
function splat(x, y, r) {
  if (reducedMotion) return;
  const n = 14;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 240;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 60,
      r: 2 + Math.random() * (r * 0.18),
      life: 0.5 + Math.random() * 0.3,
      age: 0,
      shell: Math.random() < 0.4,
    });
  }
}
function drawParticles(dt) {
  particles = particles.filter(p => p.age < p.life);
  for (const p of particles) {
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 500 * dt;
    const alpha = 1 - p.age / p.life;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.shell ? "#e8dfc9" : "#ffc53d";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ============================== Game state ========================== */

const state = {
  screen: "menu",
  mode: null,
  running: false,
  timeLeft: 0,
  score: 0,
  clicks: 0,
  hits: 0,
  eggs: [],
  // track mode
  trackEgg: null,
  onTargetTime: 0,
  elapsed: 0,
  lastFrame: 0,
  mouseX: -1, mouseY: -1,
  rafId: 0,
};

const EGG_R = () => Math.max(26, Math.min(W, H) * 0.045);
const MARGIN = 70;

function randPos(r) {
  return {
    x: MARGIN + r + Math.random() * (W - 2 * (MARGIN + r)),
    y: MARGIN + r + Math.random() * (H - 2 * (MARGIN + r)),
  };
}

function spawnEgg(minDistFrom) {
  const r = EGG_R();
  for (let tries = 0; tries < 40; tries++) {
    const p = randPos(r);
    const clear = state.eggs.every(e => Math.hypot(e.x - p.x, e.y - p.y) > r * 3) &&
      (!minDistFrom || Math.hypot(minDistFrom.x - p.x, minDistFrom.y - p.y) > Math.min(W, H) * 0.25);
    if (clear) return { x: p.x, y: p.y, r, born: performance.now() };
  }
  const p = randPos(r);
  return { x: p.x, y: p.y, r, born: performance.now() };
}

function startMode(mode) {
  state.mode = mode;
  if (mode === "reflex") { startReflex(); return; }
  show("play");
  resize();
  state.running = false;
  state.score = 0; state.clicks = 0; state.hits = 0;
  state.eggs = [];
  state.trackEgg = null;
  state.onTargetTime = 0;
  state.elapsed = 0;
  state.timeLeft = MODES[mode].duration;
  particles = [];
  $("hud-score-label").textContent = mode === "track" ? "On egg" : "Hits";
  updateHUD();

  // countdown 3-2-1
  const cd = $("countdown");
  let n = 3;
  cd.textContent = n;
  cd.classList.add("active");
  sfx.count();
  drawFrame(0);
  const tick = setInterval(() => {
    n--;
    if (n > 0) { cd.textContent = n; sfx.count(); }
    else {
      clearInterval(tick);
      cd.classList.remove("active");
      sfx.go();
      beginRun();
    }
  }, 700);
}

function beginRun() {
  const mode = state.mode;
  if (mode === "splatter") {
    while (state.eggs.length < 3) state.eggs.push(spawnEgg());
  } else if (mode === "flick") {
    state.eggs.push(spawnEgg());
  } else if (mode === "track") {
    const r = EGG_R() * 1.1;
    state.trackEgg = { x: W / 2, y: H / 2, r, vx: 0, vy: 0, wp: randPos(r) };
  }
  state.running = true;
  state.lastFrame = performance.now();
  state.rafId = requestAnimationFrame(loop);
}

function loop(now) {
  const dt = Math.min((now - state.lastFrame) / 1000, 0.05);
  state.lastFrame = now;
  if (state.running) {
    state.timeLeft -= dt;
    state.elapsed += dt;
    if (state.mode === "track") updateTrack(dt);
    if (state.timeLeft <= 0) { state.timeLeft = 0; endRun(); return; }
  }
  updateHUD();
  drawFrame(dt);
  state.rafId = requestAnimationFrame(loop);
}

function updateTrack(dt) {
  const e = state.trackEgg;
  // speed ramps from 160 to 420 px/s over the run
  const speed = (160 + 260 * (state.elapsed / MODES.track.duration)) * Math.min(W, H) / 800;
  let dx = e.wp.x - e.x, dy = e.wp.y - e.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 40) { e.wp = randPos(e.r); dx = e.wp.x - e.x; dy = e.wp.y - e.y; }
  const d2 = Math.hypot(dx, dy) || 1;
  // steer smoothly toward waypoint
  const steer = 4;
  e.vx += ((dx / d2) * speed - e.vx) * Math.min(steer * dt, 1);
  e.vy += ((dy / d2) * speed - e.vy) * Math.min(steer * dt, 1);
  e.x += e.vx * dt;
  e.y += e.vy * dt;
  const on = Math.hypot(state.mouseX - e.x, state.mouseY - e.y) <= e.r * 1.25;
  if (on) state.onTargetTime += dt;
  e.on = on;
}

function drawFrame(dt) {
  ctx.clearRect(0, 0, W, H);
  // subtle vignette grid
  ctx.strokeStyle = "rgba(255,255,255,0.03)";
  ctx.lineWidth = 1;
  const step = 64;
  ctx.beginPath();
  for (let x = step; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = step; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  if (state.mode === "track" && state.trackEgg) {
    const e = state.trackEgg;
    if (e.on) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 1.35, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,197,61,0.8)";
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    drawEgg(e.x, e.y, e.r, performance.now() / 90);
  }
  for (const e of state.eggs) drawEgg(e.x, e.y, e.r);
  drawParticles(dt || 0.016);
}

function updateHUD() {
  $("hud-time").textContent = state.timeLeft.toFixed(1);
  $("hud-time").classList.toggle("warn", state.running && state.timeLeft <= 5);
  if (state.mode === "track") {
    const pct = state.elapsed > 0 ? (state.onTargetTime / state.elapsed) * 100 : 0;
    $("hud-score").textContent = pct.toFixed(0) + "%";
  } else {
    $("hud-score").textContent = state.hits;
  }
}

canvas.addEventListener("pointermove", e => {
  const rect = canvas.getBoundingClientRect();
  state.mouseX = e.clientX - rect.left;
  state.mouseY = e.clientY - rect.top;
});

canvas.addEventListener("pointerdown", e => {
  if (!state.running || state.mode === "track") return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  state.clicks++;
  let hitIndex = -1;
  for (let i = 0; i < state.eggs.length; i++) {
    const egg = state.eggs[i];
    if (Math.hypot(mx - egg.x, my - egg.y) <= egg.r * 1.15) { hitIndex = i; break; }
  }
  if (hitIndex >= 0) {
    const egg = state.eggs.splice(hitIndex, 1)[0];
    state.hits++;
    splat(egg.x, egg.y, egg.r);
    sfx.crack();
    state.eggs.push(spawnEgg(state.mode === "flick" ? egg : null));
  } else {
    sfx.miss();
  }
});

function stopLoop() {
  cancelAnimationFrame(state.rafId);
  state.running = false;
}

$("quit-btn").addEventListener("click", () => { stopLoop(); goMenu(); });
window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (screens.play.classList.contains("active")) { stopLoop(); goMenu(); }
    else if (screens.reflex.classList.contains("active")) { cancelReflex(); goMenu(); }
    else if (screens.results.classList.contains("active")) goMenu();
  }
});

/* ============================== Reflex ============================== */

const reflexEl = $("reflex");
let reflex = null;

function startReflex() {
  show("reflex");
  reflex = { round: 0, times: [], waiting: false, goAt: 0, timer: 0 };
  $("reflex-times").textContent = "";
  nextReflexRound();
}

function nextReflexRound() {
  reflexEl.classList.remove("go");
  reflexEl.classList.add("hold");
  $("reflex-word").textContent = "WAIT…";
  $("reflex-sub").textContent = `Round ${reflex.round + 1} of 5 — click the instant the screen turns yolk.`;
  reflex.waiting = false;
  reflex.timer = setTimeout(() => {
    reflexEl.classList.remove("hold");
    reflexEl.classList.add("go");
    $("reflex-word").textContent = "CRACK!";
    $("reflex-sub").textContent = "";
    reflex.goAt = performance.now();
    reflex.waiting = true;
    sfx.go();
  }, 1200 + Math.random() * 2300);
}

reflexEl.addEventListener("pointerdown", () => {
  if (!reflex) return;
  if (reflex.waiting) {
    const ms = performance.now() - reflex.goAt;
    reflex.times.push(ms);
    reflex.round++;
    sfx.crack();
    $("reflex-times").textContent = reflex.times.map(t => Math.round(t) + "ms").join(" · ");
    if (reflex.round >= 5) {
      const avg = reflex.times.reduce((a, b) => a + b, 0) / reflex.times.length;
      const best = Math.min(...reflex.times);
      reflex = null;
      finishRun("reflex", avg, `best round ${Math.round(best)}ms`);
    } else {
      setTimeout(nextReflexRound, 500);
    }
  } else {
    // clicked too early — restart the round
    clearTimeout(reflex.timer);
    sfx.miss();
    $("reflex-word").textContent = "TOO EARLY";
    $("reflex-sub").textContent = "Jumpy trigger finger. Round restarts…";
    setTimeout(() => { if (reflex) nextReflexRound(); }, 900);
  }
});

function cancelReflex() {
  if (reflex) { clearTimeout(reflex.timer); reflex = null; }
}

/* ============================== Results ============================= */

function endRun() {
  stopLoop();
  const mode = state.mode;
  let score, detail;
  if (mode === "track") {
    score = state.elapsed > 0 ? (state.onTargetTime / state.elapsed) * 100 : 0;
    detail = `${state.onTargetTime.toFixed(1)}s on the egg out of ${state.elapsed.toFixed(0)}s`;
  } else {
    score = state.hits;
    const acc = state.clicks > 0 ? (state.hits / state.clicks) * 100 : 0;
    detail = `${state.clicks} clicks · ${acc.toFixed(0)}% accuracy` +
      (mode === "flick" && state.hits > 0 ? ` · ${(MODES.flick.duration / state.hits * 1000).toFixed(0)}ms per egg` : "");
  }
  finishRun(mode, score, detail);
}

function finishRun(mode, score, detail) {
  const m = MODES[mode];
  const prevBest = personalBest(mode);
  recordRun(mode, score);
  const isBest = prevBest === null ? true
    : (m.higherIsBetter ? score > prevBest : score < prevBest);
  show("results");
  $("result-mode").textContent = m.name;
  $("result-score").innerHTML = `${m.fmt(score)}<span class="unit"> ${m.unit}</span>`;
  $("result-detail").textContent = detail;
  $("pb-badge").classList.toggle("show", isBest);
  if (isBest) sfx.best();
}

$("retry-btn").addEventListener("click", () => startMode(state.mode));
$("menu-btn").addEventListener("click", goMenu);

function goMenu() {
  state.screen = "menu";
  renderMenu();
  show("menu");
}

/* ============================== Boot ================================ */

state.screen = "menu";
renderMenu();
</script>
